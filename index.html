<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERDAR | Solo Developer | Advanced Liquid Glass</title>
    
    <!-- Gelişmiş Fontlar & İkonlar -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        h1, .tagline {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Advanced Liquid Glass (Aero) Efektleri */
        .aero-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-bottom-color: rgba(255, 255, 255, 0.08);
            border-right-color: rgba(255, 255, 255, 0.08);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 1px 0 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        /* Cam Üzerindeki Işık Yansımaları (Specular Lines) */
        .aero-glass::before {
            content: "";
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(
                135deg, 
                rgba(255,255,255,0) 45%, 
                rgba(255,255,255,0.05) 50%, 
                rgba(255,255,255,0) 55%
            );
            transform: rotate(-45deg);
            pointer-events: none;
            opacity: 0.6;
        }

        .aero-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-color: rgba(255, 255, 255, 0.04);
            border-right-color: rgba(255, 255, 255, 0.04);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .aero-card:hover {
            transform: translateY(-8px) scale(1.03) rotate(-1deg);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 1px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(255, 255, 255, 0.2);
        }

        /* Daha Organik ve Dinamik Arka Plan Küreleri */
        .ambient-blob-organic {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: float-organic 15s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes float-organic {
            0% { transform: translate(0, 0) scale(1); filter: blur(100px); }
            33% { transform: translate(50px, -60px) scale(1.15); filter: blur(120px); }
            66% { transform: translate(-40px, 30px) scale(0.9); filter: blur(90px); }
            100% { transform: translate(10px, -10px) scale(1.05); filter: blur(100px); }
        }

        /* Parçacık Efekti için Arka Plan */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }

        /* İmleç Yanıp Sönme */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #38bdf8;
            animation: blink 1s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Swiper Özel Stil */
        .swiper-pagination-bullet {
            background: rgba(255, 255, 255, 0.3) !important;
            opacity: 1 !important;
            transition: all 0.3s ease;
        }
        .swiper-pagination-bullet-active {
            background: #38bdf8 !important;
            width: 25px !important;
            border-radius: 10px !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }
        
        /* Slogan Etiketi Geliştirme */
        .cyber-badge {
            font-family: 'Space Grotesk', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .cyber-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center relative overflow-x-hidden p-4">

    <div class="ambient-blob-organic w-72 h-72 bg-blue-600 top-10 left-10 z-0 opacity-50"></div>

    <div class="ambient-blob-organic w-64 h-64 bg-cyan-500 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-0 opacity-40" style="animation-delay: -8s;"></div>

    <!-- Ana Aero Glass Kart Container -->
    <main class="relative z-10 w-full max-w-md aero-glass rounded-3xl p-6 sm:p-10 flex flex-col items-center text-center my-10">
        
        <!-- Profil Bölümü Geliştirme -->
        <div class="relative group mb-6">
            <div class="absolute -inset-2 rounded-full bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-600 blur opacity-70 group-hover:opacity-100 group-hover:blur-xl transition-all duration-700"></div>
            <img src="profile.jpg" alt="SERDAR" class="relative w-32 h-32 rounded-full object-cover border-4 border-white/60 shadow-3xl transform group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=400&h=400&fit=crop&crop=face';">
        </div>

        <!-- İsim ve Unvan - Daha Cesur -->
        <h1 class="text-4xl font-extrabold tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-400">
            SERDAR
        </h1>
        
        <div class="inline-block px-4 py-1.5 mt-2.5 text-xs font-bold tracking-widest text-cyan-200 uppercase rounded-full bg-cyan-500/10 border border-cyan-500/20 backdrop-blur-xl">
            Solo Developer
        </div>

        <!-- Slogan - Gelişmiş Etiket -->
        <div class="my-6 px-5 py-2.5 rounded-xl cyber-badge text-xs tracking-widest text-slate-300 font-medium">

        </div>

        <!-- Dinamik Yazı Alanı - Daha Büyük -->
        <div class="h-10 flex items-center justify-center text-base font-semibold text-slate-200 mb-8 max-w-[90%]">

        </div>

        <!-- Gelişmiş Sosyal Bağlantı Kartları (Swiper Slider) -->
        <div class="w-full">
            <div class="swiper mySwiper py-4 px-1.5">
                <div class="swiper-wrapper">
                    
                    <!-- Telegram -->
                    <div class="swiper-slide px-1">

                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-400 via-sky-500 to-blue-600 flex items-center justify-center text-white text-2xl shadow-xl group-hover:scale-110 transition-transform duration-500">

                            </div>
                            <div class="text-left flex-1">

                            <i class="fa-solid fa-arrow-right-long text-slate-500 group-hover:text-white group-hover:translate-x-2 transition-all duration-500"></i>

                    <!-- Instagram -->
                    <div class="swiper-slide px-1">

                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-xl group-hover:scale-110 transition-transform duration-500">

                            <div class="text-left flex-1">

                    <!-- TikTok -->
                    <div class="swiper-slide px-1">

                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-slate-900 via-neutral-800 to-slate-950 flex items-center justify-center text-white text-2xl shadow-xl group-hover:scale-110 transition-transform duration-500 border border-white/10">

    </main>

    <!-- Script Kodları -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // Swiper Ayarları - Daha Akıcı
        const swiper = new Swiper(".mySwiper", {
            slidesPerView: 1,
            spaceBetween: 16,
            loop: true,
            speed: 800,
            autoplay: {
                delay: 4000,
                disableOnInteraction: false,
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            effect: 'slide',
        });

        // Dinamik Yazı Efekti - Daha Pürüzsüz
        const phrases = [
            "Geleceğin web deneyimlerini kodluyorum.",
            "Solo Developer & Designer.",
            "Aero Glass ile sınırları zorlayan tasarımlar...",
            "Code. Design. Deploy. 🚀"
        ];
        let phraseIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const dynamicText = document.getElementById("dynamicText");

        function typeEffect() {
            const currentPhrase = phrases[phraseIndex];
            
            if (isDeleting) {
                dynamicText.textContent = currentPhrase.substring(0, charIndex - 1);
                charIndex--;
            } else {
                dynamicText.textContent = currentPhrase.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 30 : 70; // Yazma ve silme hızları

            if (!isDeleting && charIndex === currentPhrase.length) {
                typeSpeed = 2500; // Tamamlandıktan sonra bekleme süresi
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                phraseIndex = (phraseIndex + 1) % phrases.length;
                typeSpeed = 600; // Silme bittikten sonra bekleme süresi
            }

            setTimeout(typeEffect, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", typeEffect);
    </script>
</body>
</html>
