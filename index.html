<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERDAR | Developer Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #030712;
            color: #f9fafb;
            overflow-x: hidden;
        }

        /* 3D WEBGL CANVAS (SABİT ARKA PLAN) */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* İÇERİK KATMANI */
        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* MODERN GLASS CARD */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .glass-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-[#030712] select-none">

    <canvas id="webgl-canvas"></canvas>

    <header class="fixed top-0 left-0 right-0 z-50 p-6 max-w-6xl mx-auto flex justify-between items-center">
        <div class="glass-btn px-4 py-1.5 rounded-full text-xs font-mono text-cyan-400 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>SYSTEM ONLINE</span>
        </div>
        <a href="https://t.me/ser1live" target="_blank" class="glass-btn px-5 py-2 rounded-full text-xs font-semibold text-white flex items-center gap-2">
            <span>İletişim</span>
            <i class="fa-solid fa-paper-plane text-cyan-400 text-xs"></i>
        </a>
    </header>

    <main class="content-layer w-full">

        <section class="min-h-screen flex items-center justify-center px-4">
            <div class="glass-card p-8 rounded-3xl w-full max-w-sm text-center space-y-6">
                
                <div class="relative w-24 h-24 mx-auto">
                    <img src="https://github.com/ser1live.png" alt="Serdar" class="w-full h-full rounded-full object-cover border-2 border-cyan-400/50 shadow-lg">
                    <span class="absolute bottom-1 right-1 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#030712] rounded-full"></span>
                </div>

                <div>
                    <h1 class="text-3xl font-bold tracking-tight text-white mb-2">SERDAR</h1>
                    <div class="flex items-center justify-center gap-2">
                        <span class="px-3 py-1 rounded-full glass-btn text-cyan-400 text-xs font-mono">Coder</span>
                        <span class="px-3 py-1 rounded-full glass-btn text-emerald-400 text-xs font-mono">Developer</span>
                    </div>
                </div>

                <p class="text-xs text-slate-300 leading-relaxed font-normal">
                    Modern web deneyimleri, minimalist kullanıcı arayüzleri ve 3D grafik tasarımları geliştiriyorum.
                </p>

                <div class="flex justify-center gap-3 pt-2">
                    <a href="https://t.me/ser1live" target="_blank" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-cyan-400 text-lg">
                        <i class="fa-brands fa-telegram"></i>
                    </a>
                    <a href="https://www.instagram.com/ser_dark_" target="_blank" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-pink-400 text-lg">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="https://www.tiktok.com/@serlive7" target="_blank" class="glass-btn w-10 h-10 rounded-xl flex items-center justify-center text-white text-lg">
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                </div>

            </div>
        </section>

    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('webgl-canvas');
            
            // 1. SAHNE & KAMERA SETUP
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.02);

            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 15);

            const renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                alpha: true, 
                antialias: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // GPU Dostu Limit

            // WEBGL CONTEXT LOSS KORUMASI
            canvas.addEventListener('webglcontextlost', (e) => {
                e.preventDefault();
                console.warn('WebGL Kapandı, yeniden başlatılıyor...');
            }, false);

            canvas.addEventListener('webglcontextrestored', () => {
                console.log('WebGL Yeniden Kurtarıldı!');
                init3D();
            }, false);

            // 2. DNA HELIX GRUBU
            const dnaGroup = new THREE.Group();
            dnaGroup.rotation.z = -0.5; // Çapraz Duruş
            scene.add(dnaGroup);

            const numPoints = 80;
            const turns = 3;
            const radius = 2.2;
            const height = 18;

            // STRAND 1 & 2 NOKTALARI
            const points1 = [];
            const points2 = [];

            for (let i = 0; i < numPoints; i++) {
                const fraction = i / numPoints;
                const angle = fraction * Math.PI * 2 * turns;
                const y = fraction * height - height / 2;

                const x1 = Math.cos(angle) * radius;
                const z1 = Math.sin(angle) * radius;

                const x2 = Math.cos(angle + Math.PI) * radius;
                const z2 = Math.sin(angle + Math.PI) * radius;

                points1.push(new THREE.Vector3(x1, y, z1));
                points2.push(new THREE.Vector3(x2, y, z2));

                // BAZ ÇİZGİLERİ (Nükleotit Bağları)
                if (i % 2 === 0) {
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(x1, y, z1),
                        new THREE.Vector3(x2, y, z2)
                    ]);
                    const lineMat = new THREE.LineBasicMaterial({
                        color: i % 4 === 0 ? 0x38bdf8 : 0xf59e0b,
                        transparent: true,
                        opacity: 0.6
                    });
                    const bond = new THREE.Line(lineGeo, lineMat);
                    dnaGroup.add(bond);
                }
            }

            // SARMAL ÇİZGİLER
            const curve1 = new THREE.CatmullRomCurve3(points1);
            const curve2 = new THREE.CatmullRomCurve3(points2);

            const geo1 = new THREE.BufferGeometry().setFromPoints(curve1.getPoints(150));
            const geo2 = new THREE.BufferGeometry().setFromPoints(curve2.getPoints(150));

            const strandMat1 = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 2 });
            const strandMat2 = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 2 });

            dnaGroup.add(new THREE.Line(geo1, strandMat1));
            dnaGroup.add(new THREE.Line(geo2, strandMat2));

            // ATOM KÜRELERİ (NOKTALAR)
            const nodeGeo = new THREE.SphereGeometry(0.12, 8, 8);
            const nodeMatCyan = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const nodeMatAmber = new THREE.MeshBasicMaterial({ color: 0xf59e0b });

            points1.forEach(p => {
                const sphere = new THREE.Mesh(nodeGeo, nodeMatCyan);
                sphere.position.copy(p);
                dnaGroup.add(sphere);
            });

            points2.forEach(p => {
                const sphere = new THREE.Mesh(nodeGeo, nodeMatAmber);
                sphere.position.copy(p);
                dnaGroup.add(sphere);
            });

            // ARKA PLAN PARÇACIKLARI
            const particleCount = 200;
            const particleGeo = new THREE.BufferGeometry();
            const particlePositions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                particlePositions[i] = (Math.random() - 0.5) * 20;
                particlePositions[i + 1] = (Math.random() - 0.5) * 20;
                particlePositions[i + 2] = (Math.random() - 0.5) * 20;
            }

            particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            const particleMat = new THREE.PointsMaterial({
                color: 0x38bdf8,
                size: 0.05,
                transparent: true,
                opacity: 0.5
            });

            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);

            // 3. FARE & PENCERE EYLEMLERİ
            let mouseX = 0, mouseY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 4. ANİMASYON DÖNGÜSÜ
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();

                // Yavaş Akıcı Dönüş
                dnaGroup.rotation.y = time * 0.4;
                dnaGroup.rotation.x = mouseY * 0.5;
                dnaGroup.rotation.z = -0.5 + mouseX * 0.5;

                // Parçacık Hareketi
                particles.rotation.y = time * 0.05;

                renderer.render(scene, camera);
            }

            animate();
        });
    </script>
</body>
</html>
