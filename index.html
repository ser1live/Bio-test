<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıvı Cam - Mobil Fix</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body { 
            margin: 0; 
            overflow-x: hidden; 
            background-color: #030712; /* Koyu lacivert/siyah */
            color: white; 
            font-family: sans-serif; 
        }
        
        /* 3D Tuval - Arka Planda Sabit */
        canvas { 
            display: block; 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            pointer-events: none;
        }
        
        /* Kaydırma testini yapabilmen için uzun görünmez alan */
        .ui-layer { 
            position: relative; 
            z-index: 10; 
            height: 200vh; /* Sayfayı kaydırmak için uzunluk */
            padding: 2rem; 
        }

        /* Hata olursa ekranda gösterecek kutu */
        #error-box { 
            position: fixed; 
            top: 10px; 
            left: 10px; 
            z-index: 9999; 
            color: #ef4444; 
            background: rgba(0,0,0,0.8); 
            padding: 10px; 
            font-family: monospace; 
            font-size: 12px;
            display: none; 
            border-radius: 8px;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>
    
    <div id="error-box"></div>
    
    <canvas id="webgl-canvas"></canvas>
    
    <div class="ui-layer">
        <h1 class="text-3xl font-bold mt-10 text-center text-cyan-400">3D SIVI CAM TESTİ</h1>
        <p class="text-center mt-4 text-slate-400">Fiziği görmek için sayfayı aşağı/yukarı kaydır.</p>
    </div>

    <script>
        // EĞER WEBGL ÇÖKERSE EKRANA YAZDIR
        const originalError = console.error;
        console.error = function(...args) {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerText += args.join(' ') + '\n';
            originalError.apply(console, args);
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const canvas = document.getElementById('webgl-canvas');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
                camera.position.set(0, 0, 10);

                const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                // MOBİL İÇİN DÜZELTİLMİŞ (PRECISION EKLENMİŞ) SHADER KODLARI
                const vertexShader = `
                    precision mediump float; /* MOBİL ÇÖKMEYİ ENGELLEYEN KOD */
                    uniform float uTime;
                    uniform float uScroll;
                    
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vWorldPosition;
                    varying float vDisplacement;

                    void main() {
                        vUv = uv;
                        vec3 pos = position;

                        float angle = pos.y * 0.5 + uTime * 0.3 + uScroll * 4.5;
                        
                        float wave1 = sin(pos.y * 1.8 - uTime * 1.2 + uScroll * 3.0) * 0.5;
                        float wave2 = cos(pos.y * 3.2 + uTime * 1.6) * 0.25;
                        float wave3 = sin(pos.x * 2.8 + uTime * 2.0) * 0.15;
                        vDisplacement = wave1 + wave2 + wave3;
                        
                        pos.x += vDisplacement * 0.85;
                        
                        float cosA = cos(angle);
                        float sinA = sin(angle);
                        float xRot = pos.x * cosA - pos.z * sinA;
                        float zRot = pos.x * sinA + pos.z * cosA;
                        pos.x = xRot;
                        pos.z = zRot;

                        vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        vNormal = normalize(normalMatrix * normal);

                        gl_Position = projectionMatrix * viewMatrix * worldPosition;
                    }
                `;

                const fragmentShader = `
                    precision mediump float; /* MOBİL ÇÖKMEYİ ENGELLEYEN KOD */
                    uniform float uTime;
                    uniform float uScroll;
                    
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vWorldPosition;
                    varying float vDisplacement;

                    void main() {
                        vec3 viewDir = normalize(cameraPosition - vWorldPosition);
                        float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.0);
                        
                        vec3 deepTeal = vec3(0.01, 0.10, 0.20);
                        vec3 brightCyan = vec3(0.15, 0.75, 0.95);
                        vec3 glassWhite = vec3(0.92, 0.98, 1.0);

                        float caustic = sin(vUv.y * 30.0 + vDisplacement * 8.0 + uTime * 2.5 + uScroll * 5.0) * 0.5 + 0.5;
                        caustic = pow(caustic, 4.0);

                        vec3 finalColor = mix(deepTeal, brightCyan, fresnel * 0.8 + caustic * 0.45);
                        finalColor += glassWhite * (pow(fresnel, 2.8) * 1.3 + caustic * 0.5);

                        float alpha = smoothstep(0.0, 0.12, fresnel) * 0.75 + caustic * 0.25 + 0.1;
                        alpha = clamp(alpha, 0.1, 0.85);

                        gl_FragColor = vec4(finalColor, alpha);
                    }
                `;

                const uniforms = {
                    uTime: { value: 0 },
                    uScroll: { value: 0 }
                };

                const material = new THREE.ShaderMaterial({
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    uniforms: uniforms,
                    transparent: true,
                    side: THREE.DoubleSide,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                });

                // Silindir (Sıvı Cam Bant) Geometrisi
                const geometry = new THREE.CylinderGeometry(1.8, 1.8, 18, 64, 64, true);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.rotation.z = -0.35; // Çapraz Duruş
                scene.add(mesh);

                // Kaydırma İşlemleri
                let targetScroll = 0;
                let currentScroll = 0;

                window.addEventListener('scroll', () => {
                    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                    targetScroll = window.scrollY / maxScroll;
                });

                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // Animasyon Döngüsü
                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    
                    // Yumuşak Scroll
                    currentScroll += (targetScroll - currentScroll) * 0.08;
                    
                    uniforms.uTime.value = clock.getElapsedTime();
                    uniforms.uScroll.value = currentScroll;
                    
                    // Fizik: Kaydırdıkça dönme ve süzülme
                    mesh.position.y = (currentScroll - 0.5) * -3.5;
                    mesh.rotation.y = clock.getElapsedTime() * 0.15 + currentScroll * Math.PI;

                    renderer.render(scene, camera);
                }
                
                animate();

            } catch (err) {
                console.error("WebGL Hatası: ", err.message);
            }
        });
    </script>
</body>
</html>
